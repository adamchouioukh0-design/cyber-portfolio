<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#00FF9C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#05070A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#00FF9C"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00D9FF" stroke-opacity="0.1" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background base -->
  <rect width="600" height="600" fill="#070C14"/>
  <rect width="600" height="600" fill="url(#grid)"/>
  <circle cx="300" cy="300" r="280" fill="url(#cyberGlow)"/>

  <!-- Rotating tech HUD rings -->
  <circle cx="300" cy="300" r="240" fill="none" stroke="#00D9FF" stroke-width="1.5" stroke-dasharray="12 18" stroke-opacity="0.4"/>
  <circle cx="300" cy="300" r="210" fill="none" stroke="#00FF9C" stroke-width="2" stroke-dasharray="30 80 50 40" stroke-opacity="0.5"/>
  <circle cx="300" cy="300" r="180" fill="none" stroke="#00D9FF" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.3"/>

  <!-- Crosshair markings -->
  <line x1="300" y1="40" x2="300" y2="70" stroke="#00D9FF" stroke-width="2"/>
  <line x1="300" y1="530" x2="300" y2="560" stroke="#00D9FF" stroke-width="2"/>
  <line x1="40" y1="300" x2="70" y2="300" stroke="#00D9FF" stroke-width="2"/>
  <line x1="530" y1="300" x2="560" y2="300" stroke="#00D9FF" stroke-width="2"/>

  <!-- Digital Operator Silhouette -->
  <g transform="translate(150, 110)">
    <!-- Shoulders / Torso -->
    <path d="M 150 250 C 70 250, 30 310, 10 390 L 290 390 C 270 310, 230 250, 150 250 Z" 
          fill="#0B1324" stroke="url(#cyberBorder)" stroke-width="2"/>
    <!-- Tactical neck collar -->
    <path d="M 115 250 L 125 210 L 175 210 L 185 250 Z" fill="#0E192E" stroke="#00D9FF" stroke-width="1.5"/>
    
    <!-- Head / Helmet Silhouette -->
    <ellipse cx="150" cy="155" rx="72" ry="85" fill="#080F1E" stroke="#00D9FF" stroke-width="2"/>
    
    <!-- Cybernetic Visor / HUD Glow -->
    <path d="M 95 150 Q 150 162 205 150 L 202 175 Q 150 188 98 175 Z" fill="#00D9FF" opacity="0.85" filter="drop-shadow(0 0 10px #00D9FF)"/>
    <path d="M 110 160 L 190 160" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    
    <!-- Data telemetry marks on faceplate -->
    <rect x="100" y="195" width="25" height="3" fill="#00FF9C" opacity="0.7"/>
    <rect x="130" y="195" width="15" height="3" fill="#00D9FF" opacity="0.7"/>
    <rect x="150" y="195" width="30" height="3" fill="#00FF9C" opacity="0.7"/>
  </g>

  <!-- Corner targeting brackets -->
  <path d="M 40 80 L 40 40 L 80 40" fill="none" stroke="#00FF9C" stroke-width="3"/>
  <path d="M 520 40 L 560 40 L 560 80" fill="none" stroke="#00D9FF" stroke-width="3"/>
  <path d="M 40 520 L 40 560 L 80 560" fill="none" stroke="#00D9FF" stroke-width="3"/>
  <path d="M 560 520 L 560 560 L 520 560" fill="none" stroke="#00FF9C" stroke-width="3"/>

  <!-- Telemetry text overlay -->
  <text x="50" y="585" fill="#00FF9C" font-family="monospace" font-size="12" letter-spacing="2">OPERATOR: IDENTITY_MASKED // SEC-01</text>
  <text x="390" y="585" fill="#00D9FF" font-family="monospace" font-size="12" letter-spacing="2">SYS_NODE: 127.0.0.1</text>
  <text x="50" y="30" fill="#00D9FF" font-family="monospace" font-size="11" letter-spacing="1">DEFCON 5 // ENCRYPTION ACTIVE</text>
  <text x="440" y="30" fill="#00FF9C" font-family="monospace" font-size="11" letter-spacing="1">[REPLACE PHOTO]</text>
</svg>
