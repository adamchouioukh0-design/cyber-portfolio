<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dnsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182B"/>
      <stop offset="100%" stop-color="#030811"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#dnsGrad)"/>
  <rect x="30" y="30" width="740" height="390" rx="10" fill="#0A1424" stroke="#00D9FF" stroke-opacity="0.3" stroke-width="1.5"/>
  <path d="M 30 40 Q 30 30 40 30 L 760 30 Q 770 30 770 40 L 770 70 L 30 70 Z" fill="#0E1C30"/>
  <circle cx="55" cy="50" r="5" fill="#EF4444"/>
  <circle cx="72" cy="50" r="5" fill="#F59E0B"/>
  <circle cx="89" cy="50" r="5" fill="#10B981"/>
  <text x="110" y="55" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12">dig @10.0.10.5 axfr corp.internal. +dnssec +sigchase</text>

  <!-- Left: DNSSEC Server Architecture Flow -->
  <g transform="translate(80, 110)">
    <!-- Primary Server -->
    <rect x="0" y="0" width="160" height="70" rx="6" fill="#111E38" stroke="#00D9FF" stroke-width="1.5"/>
    <text x="80" y="30" fill="#00D9FF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">PRIMARY BIND9</text>
    <text x="80" y="50" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">10.0.10.5 (Master)</text>

    <!-- Zone transfer arrow -->
    <line x1="160" y1="35" x2="260" y2="35" stroke="#00FF9C" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="210" y="25" fill="#00FF9C" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">TSIG AXFR</text>

    <!-- Secondary Server -->
    <rect x="260" y="0" width="160" height="70" rx="6" fill="#111E38" stroke="#00FF9C" stroke-width="1.5"/>
    <text x="340" y="30" fill="#00FF9C" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">SECONDARY BIND9</text>
    <text x="340" y="50" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">10.0.20.5 (Slave)</text>

    <!-- Client Resolver -->
    <rect x="130" y="140" width="160" height="60" rx="6" fill="#152445" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="210" y="165" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">SECURE RESOLVER</text>
    <text x="210" y="185" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">DNSSEC RRSIG Validation</text>

    <line x1="210" y1="140" x2="80" y2="70" stroke="#00D9FF" stroke-width="1.5"/>
    <line x1="210" y1="140" x2="340" y2="70" stroke="#00FF9C" stroke-width="1.5"/>
  </g>

  <!-- Right: Technical Validation Notes -->
  <g transform="translate(540, 110)">
    <text x="0" y="20" fill="#00FF9C" font-family="'JetBrains Mono', monospace" font-size="11">;; -&gt;&gt;HEADER&lt;&lt;- opcode: QUERY, status: NOERROR</text>
    <text x="0" y="45" fill="#00D9FF" font-family="'JetBrains Mono', monospace" font-size="11">;; flags: qr aa rd ra ad; QUERY: 1, ANSWER: 2</text>
    <text x="0" y="70" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11">;; [AD FLAG ACTIVE: DNSSEC AUTHENTIC DATA]</text>
    
    <text x="0" y="110" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11">RRSIG KEYTAG: 42918 ALGO: 13 (ECDSA-P256)</text>
    <text x="0" y="135" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Split-Horizon Views: Internal vs External</text>
    <text x="0" y="160" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Restricted Zone Transfers: TSIG HMAC-SHA256</text>
    <text x="0" y="185" fill="#00FF9C" font-family="'JetBrains Mono', monospace" font-size="10">Cache Poisoning Mitigation: 100% Validated</text>
  </g>
</svg>
