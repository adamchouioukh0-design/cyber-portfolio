<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="reconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E081F"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#reconGrad)"/>
  
  <rect x="30" y="30" width="740" height="390" rx="10" fill="#0E1222" stroke="#A855F7" stroke-opacity="0.3" stroke-width="1.5"/>
  <path d="M 30 40 Q 30 30 40 30 L 760 30 Q 770 30 770 40 L 770 70 L 30 70 Z" fill="#14182E"/>
  <circle cx="55" cy="50" r="5" fill="#EF4444"/>
  <circle cx="72" cy="50" r="5" fill="#F59E0B"/>
  <circle cx="89" cy="50" r="5" fill="#10B981"/>
  <text x="110" y="55" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="12">./recon-pipeline.sh --domain target.corp --osint --deep-dns --output-graph</text>

  <!-- Node Linkage Graph -->
  <g transform="translate(180, 230)">
    <!-- Central root domain node -->
    <circle cx="0" cy="0" r="28" fill="#1E1435" stroke="#A855F7" stroke-width="2"/>
    <text x="0" y="4" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">TARGET</text>
    
    <!-- Child lines -->
    <line x1="0" y1="0" x2="-90" y2="-70" stroke="#00D9FF" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="0" y1="0" x2="90" y2="-70" stroke="#00D9FF" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="-100" y2="70" stroke="#00FF9C" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="100" y2="70" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Nodes -->
    <circle cx="-90" cy="-70" r="20" fill="#0F172A" stroke="#00D9FF" stroke-width="1.5"/>
    <text x="-90" y="-66" fill="#00D9FF" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">api.*</text>

    <circle cx="90" cy="-70" r="20" fill="#0F172A" stroke="#00D9FF" stroke-width="1.5"/>
    <text x="90" y="-66" fill="#00D9FF" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">vpn.*</text>

    <circle cx="-100" cy="70" r="20" fill="#0F172A" stroke="#00FF9C" stroke-width="1.5"/>
    <text x="-100" y="74" fill="#00FF9C" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">auth.*</text>

    <circle cx="100" cy="70" r="20" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="100" y="74" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">dev.*</text>
  </g>

  <!-- Reconnaissance modules breakdown -->
  <g transform="translate(420, 100)">
    <text x="0" y="20" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="12">[RECON PHASE 1] CRT.SH CERTIFICATE LOGS DISCOVERY</text>
    <text x="0" y="50" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">&gt; Found 38 unique FQDN subdomains</text>
    
    <text x="0" y="80" fill="#00D9FF" font-family="'JetBrains Mono', monospace" font-size="12">[RECON PHASE 2] ASYNCHRONOUS DNS RESOLUTION</text>
    <text x="0" y="110" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">&gt; Massdns resolved 24 live A records (Avg: 18ms)</text>

    <text x="0" y="140" fill="#00FF9C" font-family="'JetBrains Mono', monospace" font-size="12">[RECON PHASE 3] HTTP SERVICE FINGERPRINTING</text>
    <text x="0" y="170" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">&gt; Detected Nginx 1.22, Traefik, OpenSSH 8.9</text>

    <text x="0" y="200" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="12">[VULNERABILITY FINDING] dev.target.corp EXPOSED GIT REPO</text>
    <text x="0" y="230" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">Automated Markdown Report Generated: 14 Pages with Risk Scores</text>
  </g>
</svg>
