<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="preSecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081A24"/>
      <stop offset="50%" stop-color="#040F17"/>
      <stop offset="100%" stop-color="#02080D"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9C"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="preSecGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#00FF9C" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#preSecGrad)"/>
  <rect width="800" height="500" rx="16" fill="url(#preSecGrid)"/>
  <rect x="20" y="20" width="760" height="460" rx="12" fill="none" stroke="#00FF9C" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="30" y="30" width="740" height="440" rx="8" fill="none" stroke="#00D9FF" stroke-opacity="0.15" stroke-dasharray="6 6"/>

  <!-- Shield and Circuit Emblem -->
  <g transform="translate(60, 60)">
    <path d="M 45 10 L 80 25 L 80 55 C 80 75, 45 90, 45 90 C 45 90, 10 75, 10 55 L 10 25 Z" fill="#0C2028" stroke="url(#emeraldGlow)" stroke-width="3"/>
    <path d="M 30 50 L 40 60 L 60 38" fill="none" stroke="#00FF9C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Headers -->
  <text x="180" y="85" fill="#00FF9C" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="4">TRYHACKME // FOUNDATIONAL PATH</text>
  <text x="180" y="125" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="28" letter-spacing="1">Pre-Security Learning Path</text>
  <text x="180" y="155" fill="#00D9FF" font-family="'JetBrains Mono', monospace" font-size="13">AWARDED TO: ADAM CHOUIOUKH // ID: THM-WCF5XJSZJO</text>

  <!-- Technical badges -->
  <g transform="translate(60, 200)">
    <rect width="160" height="36" rx="6" fill="#0E262E" stroke="#00FF9C" stroke-opacity="0.4"/>
    <text x="80" y="23" fill="#00FF9C" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">Network Fundamentals</text>

    <rect x="180" width="160" height="36" rx="6" fill="#0E262E" stroke="#00D9FF" stroke-opacity="0.4"/>
    <text x="260" y="23" fill="#00D9FF" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">TCP/IP &amp; OSI Layers</text>

    <rect x="360" width="160" height="36" rx="6" fill="#0E262E" stroke="#F59E0B" stroke-opacity="0.4"/>
    <text x="440" y="23" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">Linux Foundations</text>

    <rect x="540" width="160" height="36" rx="6" fill="#0E262E" stroke="#A855F7" stroke-opacity="0.4"/>
    <text x="620" y="23" fill="#A855F7" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">Web Basics</text>
  </g>

  <!-- Certificate metadata footer -->
  <line x1="60" y1="380" x2="740" y2="380" stroke="#1E293B" stroke-width="1"/>
  <text x="60" y="420" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">ISSUER: TryHackMe Cyber Security Training Platform</text>
  <text x="60" y="445" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">CERTIFICATE ID: THM-WCF5XJSZJO // VERIFIED AUTHENTIC</text>
  <text x="560" y="430" fill="#00FF9C" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">[OFFICIAL CERTIFICATE]</text>
</svg>
