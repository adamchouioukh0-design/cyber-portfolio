<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ciscoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07182E"/>
      <stop offset="50%" stop-color="#050E1C"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
    <linearGradient id="ciscoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <pattern id="ciscoGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0284C7" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#ciscoGrad)"/>
  <rect width="800" height="500" rx="16" fill="url(#ciscoGrid)"/>
  <rect x="20" y="20" width="760" height="460" rx="12" fill="none" stroke="#00D9FF" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Cisco Iconic Bridge Bars -->
  <g transform="translate(60, 60)">
    <rect x="0" y="35" width="8" height="30" fill="#00D9FF" rx="4"/>
    <rect x="16" y="20" width="8" height="45" fill="#00D9FF" rx="4"/>
    <rect x="32" y="5" width="8" height="60" fill="#00FF9C" rx="4"/>
    <rect x="48" y="20" width="8" height="45" fill="#00D9FF" rx="4"/>
    <rect x="64" y="35" width="8" height="30" fill="#00D9FF" rx="4"/>
  </g>

  <!-- Headers -->
  <text x="180" y="90" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="4">CISCO CAREER CERTIFICATION</text>
  <text x="180" y="130" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="28" letter-spacing="1">CCNA - Cisco Certified Network Associate</text>
  <text x="180" y="160" fill="#00FF9C" font-family="'JetBrains Mono', monospace" font-size="14">STATUS: ACTIVE &amp; VERIFIED // TRACK: 200-301 CCNA</text>

  <!-- Technical badges -->
  <g transform="translate(60, 200)">
    <rect width="160" height="35" rx="6" fill="#0F172A" stroke="#00D9FF" stroke-opacity="0.4"/>
    <text x="80" y="22" fill="#00D9FF" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">IPv4 / IPv6 Subnetting</text>

    <rect x="180" width="160" height="35" rx="6" fill="#0F172A" stroke="#00FF9C" stroke-opacity="0.4"/>
    <text x="260" y="22" fill="#00FF9C" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">VLANs &amp; 802.1Q</text>

    <rect x="360" width="160" height="35" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4"/>
    <text x="440" y="22" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">OSPF Routing</text>

    <rect x="540" width="160" height="35" rx="6" fill="#0F172A" stroke="#A855F7" stroke-opacity="0.4"/>
    <text x="620" y="22" fill="#A855F7" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">DHCP Snooping</text>
  </g>

  <!-- Certificate metadata footer -->
  <line x1="60" y1="380" x2="740" y2="380" stroke="#1E293B" stroke-width="1"/>
  <text x="60" y="420" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">ISSUED BY: Cisco Systems, Inc.</text>
  <text x="60" y="445" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">ROUTING &amp; SWITCHING ARCHITECTURE</text>
  <text x="580" y="430" fill="#00FF9C" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">[PLACEHOLDER PREVIEW]</text>
</svg>
